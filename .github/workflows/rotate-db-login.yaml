name: "Rotate database login"
# Blue-green database password rotation, started by hand. The run page first
# says which login is idle, the one the switch database_user_active in
# api_secrets doesn't name, so that a person can put a new password in that
# login's slot. Then, with a person approving each step:
#   1. give the idle login that new password;
#   2. once a person has flipped the switch to that login, restart the API
#      replicas one at a time so they use it;
#   3. once a person has emptied the previous login's slot, switch off that
#      login's password, add the rotation to the log in a pull request, and
#      say the rotation is complete.
# The approval jobs run on GitHub. The other jobs run on a self-hosted runner
# on the machine where docker compose runs, in the folder the repository
# variable DEMO_DIR names. README.md walks through a run.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment whose database login to rotate"
        type: choice
        options:
          - demo

permissions:
  contents: read

env:
  DEMO_DIR: ${{ vars.DEMO_DIR }}
  SECRETS_DIR: ${{ vars.DEMO_DIR }}/secrets
  PYTHON: ${{ vars.DEMO_DIR }}/.venv/bin/python

jobs:
  find_idle_login:
    name: "Find the idle login"
    runs-on: self-hosted
    environment:
      name: ${{ inputs.environment }}
    outputs:
      idle_login: ${{ steps.find.outputs.idle_login }}
      idle_slot: ${{ steps.find.outputs.idle_slot }}
      active_slot: ${{ steps.find.outputs.active_slot }}
    steps:
      - name: Check the runner can see the project
        run: |
          test -n "$DEMO_DIR" || { echo "Set the repository variable DEMO_DIR to the project folder on the runner's machine"; exit 1; }
          test -x "$PYTHON" || { echo "$PYTHON is missing: create the venv in $DEMO_DIR first (see README)"; exit 1; }
      - name: Read the switch
        id: find
        run: |
          cd "$DEMO_DIR"
          "$PYTHON" rotate/rotate_db_login.py find-idle
      - name: Say what to do first
        run: |
          echo "### Step 1: put a new password in ${IDLE_SLOT}" >> "$GITHUB_STEP_SUMMARY"
          echo "${IDLE_LOGIN} is the idle login on ${{ inputs.environment }}. Run \`python3 rotate/secrets_store.py new-password ${IDLE_LOGIN}\` and change nothing else. Then approve Gate 1." >> "$GITHUB_STEP_SUMMARY"
        env:
          IDLE_LOGIN: ${{ steps.find.outputs.idle_login }}
          IDLE_SLOT: ${{ steps.find.outputs.idle_slot }}

  approve:
    # The name shows next to "Review deployments": what must be done first.
    name: "Gate 1: new password in ${{ needs.find_idle_login.outputs.idle_slot }}"
    needs: find_idle_login
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}-gate
    steps:
      - run: echo "${{ needs.find_idle_login.outputs.idle_slot }} holds the new password"

  set_new_password:
    name: "Give the idle login its new password"
    needs: [find_idle_login, approve]
    runs-on: self-hosted
    environment:
      name: ${{ inputs.environment }}
    env:
      NEW_LOGIN: ${{ needs.find_idle_login.outputs.idle_login }}
    steps:
      - name: Set the new password
        # --new-login makes the step refuse if the switch changed since the
        # run started, instead of setting the other login's password.
        run: |
          cd "$DEMO_DIR"
          "$PYTHON" rotate/rotate_db_login.py set-password --new-login "$NEW_LOGIN"
      - name: Say what to do next
        run: |
          echo "### Step 2: flip the switch to ${NEW_LOGIN}" >> "$GITHUB_STEP_SUMMARY"
          echo "${NEW_LOGIN} has its new password. Run \`python3 rotate/secrets_store.py switch ${NEW_LOGIN}\`, then approve Gate 2." >> "$GITHUB_STEP_SUMMARY"

  approve_switch:
    name: "Gate 2: switch to ${{ needs.find_idle_login.outputs.idle_login }}"
    needs: [find_idle_login, set_new_password]
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}-gate
    steps:
      - run: echo "database_user_active flipped to ${{ needs.find_idle_login.outputs.idle_login }}"

  switch_over:
    name: "Move the API to the new login"
    needs: [find_idle_login, approve_switch]
    runs-on: self-hosted
    environment:
      name: ${{ inputs.environment }}
    env:
      NEW_LOGIN: ${{ needs.find_idle_login.outputs.idle_login }}
    steps:
      - name: Check the switch names the new login
        run: |
          cd "$DEMO_DIR"
          "$PYTHON" rotate/rotate_db_login.py check-switch --new-login "$NEW_LOGIN"
      - name: Restart the API replicas one at a time
        # --wait returns once the recreated replica answers /health, so the
        # second one is only restarted when the first is back.
        run: |
          cd "$DEMO_DIR"
          for REPLICA in api_1 api_2; do
            docker compose up -d --force-recreate --no-deps --wait "$REPLICA"
          done
      - name: Check each restarted replica logs in as the new login
        # The API connects when it starts, but a real one may only connect
        # once a request needs the database. So the check runs inside each
        # replica, piped in, as a real system does with kubectl exec.
        run: |
          cd "$DEMO_DIR"
          for REPLICA in api_1 api_2; do
            echo "$REPLICA:"
            docker compose exec -T "$REPLICA" python - --new-login "$NEW_LOGIN" < rotate/check_api_login.py
          done
      - name: Say what to do next
        run: |
          PREVIOUS=${PREVIOUS_SLOT%_password}
          echo "### Step 3: empty ${PREVIOUS_SLOT}" >> "$GITHUB_STEP_SUMMARY"
          echo "The ${{ inputs.environment }} API now uses ${NEW_LOGIN}. Run \`python3 rotate/secrets_store.py empty ${PREVIOUS}\`, then approve Gate 3 to switch off ${PREVIOUS}'s password. Until then you can still go back: flip the switch back and restart." >> "$GITHUB_STEP_SUMMARY"
        env:
          PREVIOUS_SLOT: ${{ needs.find_idle_login.outputs.active_slot }}

  approve_switch_off:
    name: "Gate 3: empty ${{ needs.find_idle_login.outputs.active_slot }}"
    needs: [find_idle_login, switch_over]
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}-gate
    steps:
      - run: echo "Switching off the password of the login before ${{ needs.find_idle_login.outputs.idle_login }}"

  switch_off:
    name: "Switch off the previous login and log the rotation"
    needs: [find_idle_login, approve_switch_off]
    runs-on: self-hosted
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: write # push the log's branch
      pull-requests: write # open the log's pull request
      actions: read # the run's approvals, for the log
    env:
      NEW_LOGIN: ${{ needs.find_idle_login.outputs.idle_login }}
      LOG: rotations/${{ inputs.environment }}.csv
      # A pull request opened with the built-in token doesn't start other
      # workflows, so the log's check only runs on it if LOG_PR_TOKEN, a
      # fine-grained token of a person, is set. Without it, the check runs
      # on main once the pull request is merged.
      GH_TOKEN: ${{ secrets.LOG_PR_TOKEN || github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Switch off the previous login's password
        run: |
          cd "$DEMO_DIR"
          "$PYTHON" rotate/rotate_db_login.py switch-off --new-login "$NEW_LOGIN"
      - name: Add the rotation to the log, in a pull request
        id: log
        # Only people count as approvers: an environment's wait timer shows up
        # as an approval by github-actions[bot].
        run: |
          APPROVED_BY=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" --jq '[.[] | select(.state == "approved" and .user.type == "User") | .user.login] | unique | join(";")')
          "$PYTHON" rotate/rotate_db_login.py log --new-login "$NEW_LOGIN" --approved-by "$APPROVED_BY" --file "$LOG"
          BRANCH="db-login-rotation/${{ inputs.environment }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          TITLE="Log the ${{ inputs.environment }} database login rotation"
          git switch -c "$BRANCH"
          git add "$LOG"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "$TITLE"
          git push origin "$BRANCH"
          PR=$(gh pr create --base "$GITHUB_REF_NAME" --head "$BRANCH" --title "$TITLE" --body "Added by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID, approved by $APPROVED_BY.")
          echo "approved_by=$APPROVED_BY" >> "$GITHUB_OUTPUT"
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
      - name: Say the rotation is complete
        run: |
          echo "### Done: rotation complete on ${{ inputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${NEW_LOGIN} is the active login, and the previous login's password is switched off. Approved by ${APPROVED_BY}." >> "$GITHUB_STEP_SUMMARY"
          echo "Merge the log's pull request to keep the record: ${LOG_PR}" >> "$GITHUB_STEP_SUMMARY"
        env:
          APPROVED_BY: ${{ steps.log.outputs.approved_by }}
          LOG_PR: ${{ steps.log.outputs.pr }}
